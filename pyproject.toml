[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slmbench"
version = "0.1.0"
description = "Benchmarking harness and decision-support advisor for small language model adaptation under constrained resources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcel Palmer" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.45", "peft>=0.12", "bitsandbytes>=0.43", "accelerate>=0.34", "datasets>=2.20",
       "nvidia-ml-py>=12.535"]
edge = ["psutil", "requests"]
rag = ["rank_bm25"]
analysis = ["numpy", "scipy", "pandas", "matplotlib"]
dev = ["pytest"]

[project.scripts]
slmbench = "slmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:urllib3 v2 only supports OpenSSL"]
