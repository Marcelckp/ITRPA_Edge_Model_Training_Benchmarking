name: edge-container-4c8g
tier: edge
description: >-
  Container-emulated edge device (pilot, PILOT.md): Docker container on an x86 Intel Xeon host capped with
  --cpuset-cpus 16-19 --cpus 4 --memory 8g --memory-swap 8g. Not a Raspberry Pi; Xeon cores are faster per core
  than the Pi 5's Cortex-A76, so absolute latencies are not Pi latencies.
paths:
  models_dir: /cache/models
  llama_cpp_dir: /opt/llama.cpp
# llama.cpp b12532 replaced --mlock with --load-mode; mmap+mlock keeps the old --mlock behaviour. --cache-ram 0
# disables the server-side prompt cache, which would reuse prefixes across queries and inflate memory.
# --fit off stops the server from changing unset arguments to fit memory, so every device runs the same settings.
backends:
  llamacpp:
    kind: llamacpp
    base_url: http://127.0.0.1:8080
    api: chat
    timeout_s: 1800
    manage_server: true
    startup_timeout_s: 600
    server_cmd: ["{llama_cpp_dir}/build/bin/llama-server", "-m", "{model_path}", "--host", "127.0.0.1",
                 "--port", "8080", "-c", "4096", "-t", "4", "--seed", "42", "-np", "1", "--load-mode", "mmap+mlock",
                 "--cache-ram", "0", "--fit", "off", "--jinja"]
# No RAPL/NVML/meter in the virtualised host: memory (PSS, fallback RSS) only, energy is not measured.
telemetry:
  interval_s: 0.1
  power: []
  memory: [rss]
runner:
  cooldown_below_c: 50
  thermal_wait_max_s: 0
